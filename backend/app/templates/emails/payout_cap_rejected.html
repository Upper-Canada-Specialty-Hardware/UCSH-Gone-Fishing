{# Payout auto-rejected (annual cap) notice. Restyled to the shared layout;
   the reason box is now a bgcolor cell. #}
<h2 style="color:#2f5d50;font-family:'Segoe UI',Arial,sans-serif;font-size:18px;font-weight:bold;margin:0 0 12px;">Payout Request - Auto Rejected</h2>
<p style="font-family:'Segoe UI',Arial,sans-serif;font-size:14px;line-height:1.5;color:#1f1a14;margin:0 0 12px;">Your Payout Request #{{ request_id }} has been auto-rejected by the system.</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;margin:16px 0;">
  <tr>
    <td bgcolor="#fef2f2" style="background:#fef2f2;padding:12px 16px;border-left:4px solid #dc2626;font-family:'Segoe UI',Arial,sans-serif;font-size:14px;color:#1f1a14;"><strong>Reason:</strong> {{ reason }}</td>
  </tr>
</table>
