server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text on the way out: the app script is about 1.7 MB raw and about
    # a third of that gzipped. nginx compresses html by default; add the rest.
    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Hashed build assets (Vite puts them under /assets/ with a content hash in
    # the name) never change for a given name, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, so a new build is picked up at once and
    # the auto-update reload actually fetches the new bundle (#331). This header
    # covers both a direct request and the single-page fallback below.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
