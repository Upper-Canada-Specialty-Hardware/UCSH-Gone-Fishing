:root {
  --bg: #f6f7f9; --paper: #ffffff; --ink: #121826; --muted: #5f6b7a; --line: #e6e9ee; --line2: #cfd5dd; --hover: #f2f5f8; --chip: #eef1f5;
  --ok: #15803d; --ok-soft: #e7f5ec; --err: #c2410c; --err-strong: #dc2626; --err-soft: #fdeee8; --warn: #a16207; --warn-soft: #fbf3dc; --info: #0369a1; --info-soft: #e4f1fa;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 16px rgba(16,24,40,.06); --shadow-lg: 0 12px 40px rgba(16,24,40,.18);
  --review: #11151c; --review-ink: #e6e9ef;
  --primary: #0e6b7a; --primary-ink: #ffffff; --primary-soft: #e2f1f3; --accent: #f08a4b;
  --bar-bg: var(--paper); --bar-ink: var(--ink); --bar-line: var(--line);
  --side-bg: var(--paper); --side-ink: var(--ink); --side-muted: var(--muted); --side-on: var(--primary-soft); --side-on-ink: var(--primary);
  --font: "Figtree", "Segoe UI", system-ui, sans-serif; --display: var(--font); --radius: 12px; --h1w: 650;
}
body[data-skin="today"] { --primary: #1e40af; --primary-soft: #eaf0fd; --accent: #1e40af; --bar-bg: #1e40af; --bar-ink: #fff; --bar-line: #1e40af; --font: "Inter", "Segoe UI", sans-serif; --display: var(--font); --radius: 8px; --ok: #16a34a; --err: #dc2626; --h1w: 600; }
body[data-skin="slate"] { --primary: #4f46e5; --primary-soft: #eceafd; --accent: #4f46e5; --side-bg: #111827; --side-ink: #e5e7eb; --side-muted: #8b93a3; --side-on: #1f2937; --side-on-ink: #ffffff; --font: "Geist", "Segoe UI", sans-serif; --display: var(--font); --radius: 10px; }
body[data-skin="sunday"] { --bg: #f7f3ec; --paper: #fffdf9; --ink: #1f1a14; --muted: #6b6257; --line: #ebe4d8; --line2: #d9cfbf; --hover: #f3ede3; --chip: #f1ebe0;
  --primary: #2f5d50; --primary-soft: #e5efe9; --accent: #e07a5f; --font: "DM Sans", "Segoe UI", sans-serif; --display: "Fraunces", Georgia, serif; --radius: 14px; --h1w: 600; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) body { --bg: #0f1318; --paper: #171c23; --ink: #e7eaee; --muted: #9aa3ae; --line: #262d37; --line2: #36404c; --hover: #1d242d; --chip: #222a34;
    --ok: #4ade80; --ok-soft: #13301f; --err: #fb923c; --err-strong: #f87171; --err-soft: #3a1d12; --warn: #facc15; --warn-soft: #332a0e; --info: #7dd3fc; --info-soft: #102c3c;
    --primary: #5fc4d2; --primary-ink: #071a1e; --primary-soft: #133238; --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 12px 40px rgba(0,0,0,.6); color-scheme: dark; }
  :root:not([data-theme="light"]) body[data-skin="today"] { --primary: #8aa6f5; --primary-soft: #1f2b48; --bar-bg: #1b2a55; }
  :root:not([data-theme="light"]) body[data-skin="slate"] { --primary: #a5a0ff; --primary-soft: #26244a; --side-bg: #0b0f16; }
  :root:not([data-theme="light"]) body[data-skin="sunday"] { --bg: #14120f; --paper: #1d1a16; --line: #2e2922; --line2: #3e372d; --hover: #25211b; --chip: #2a251e; --primary: #8cc5b2; --primary-soft: #1e332c; }
}
:root[data-theme="dark"] body { --bg: #0f1318; --paper: #171c23; --ink: #e7eaee; --muted: #9aa3ae; --line: #262d37; --line2: #36404c; --hover: #1d242d; --chip: #222a34;
  --ok: #4ade80; --ok-soft: #13301f; --err: #fb923c; --err-strong: #f87171; --err-soft: #3a1d12; --warn: #facc15; --warn-soft: #332a0e; --info: #7dd3fc; --info-soft: #102c3c;
  --primary: #5fc4d2; --primary-ink: #071a1e; --primary-soft: #133238; --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 12px 40px rgba(0,0,0,.6); color-scheme: dark; }
:root[data-theme="dark"] body[data-skin="today"] { --primary: #8aa6f5; --primary-soft: #1f2b48; --bar-bg: #1b2a55; }
:root[data-theme="dark"] body[data-skin="slate"] { --primary: #a5a0ff; --primary-soft: #26244a; --side-bg: #0b0f16; }
:root[data-theme="dark"] body[data-skin="sunday"] { --bg: #14120f; --paper: #1d1a16; --line: #2e2922; --line2: #3e372d; --hover: #25211b; --chip: #2a251e; --primary: #8cc5b2; --primary-soft: #1e332c; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.review { background: var(--review); color: var(--review-ink); padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-family: "Inter", sans-serif; font-size: 12.5px; }
.seg { display: inline-flex; border: 1px solid rgba(255,255,255,.22); border-radius: 8px; overflow: hidden; }
.seg button { background: none; border: 0; color: var(--review-ink); padding: 5px 11px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: #e6e9ef; color: #11151c; font-weight: 600; }
.review label { display: inline-flex; gap: 6px; align-items: center; }
.review select { background: #e6e9ef; color: #11151c; border: 0; border-radius: 6px; padding: 4px 8px; }
.review .rbtn { background: none; border: 1px solid rgba(255,255,255,.3); color: var(--review-ink); border-radius: 8px; padding: 4px 10px; cursor: pointer; }

.appbar { background: var(--bar-bg); color: var(--bar-ink); border-bottom: 1px solid var(--bar-line); height: 58px; padding: 0 18px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 5; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; }
.mark { width: 28px; height: 28px; border-radius: 8px; background: var(--primary); color: var(--primary-ink); display: grid; place-items: center; font-size: 11px; font-weight: 800; position: relative; }
.mark i { position: absolute; right: -3px; top: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bar-bg); }
body[data-skin="today"] .mark { display: none; }
.appbar .who { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; white-space: nowrap; min-width: 0; }
@media (max-width: 520px) { .appbar .who span:last-child { display: none; } }
.menu { display: none; background: none; border: 0; color: inherit; cursor: pointer; padding: 6px; border-radius: 8px; }
.av { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; color: #fff; }
.av.lg { width: 40px; height: 40px; font-size: 14px; }

.layout { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: calc(100vh - 58px - 42px); }
.layout.full { grid-template-columns: minmax(0, 1fr); }
.layout.full main { margin: 0 auto; }
.side { background: var(--side-bg); color: var(--side-ink); border-right: 1px solid var(--line); padding: 12px 10px 24px; }
body[data-skin="slate"] .side { border-right-color: transparent; }
.side .grp { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--side-muted); padding: 16px 12px 6px; }
.side button { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; background: none; border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 14px; color: var(--side-ink); }
.side button:hover { background: color-mix(in srgb, var(--side-on) 70%, transparent); }
.side button[aria-current="page"] { background: var(--side-on); color: var(--side-on-ink); font-weight: 600; }
.side .n { margin-left: auto; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 8px; background: var(--chip); color: var(--ink); font-variant-numeric: tabular-nums; }
body[data-skin="slate"] .side .n { background: #273142; color: #e5e7eb; }
.side .n.warm { background: var(--accent); color: #fff; }
body[data-skin="today"] .side .n.warm { background: #b45309; }
.side .sep { border-top: 1px solid color-mix(in srgb, var(--side-muted) 30%, transparent); margin: 16px 12px 8px; }
.side .quiet button { font-size: 13px; color: var(--side-muted); padding: 6px 12px; }
.side .quiet button[aria-current="page"] { color: var(--side-on-ink); }
.side .quiet .n { background: transparent; color: var(--side-muted); border: 1px solid color-mix(in srgb, var(--side-muted) 40%, transparent); }
.scrim { display: none; }
@media (max-width: 880px) {
  .menu { display: inline-flex; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; top: 0; bottom: 0; left: 0; width: 280px; z-index: 12; transform: translateX(-102%); box-shadow: var(--shadow-lg); overflow-y: auto; }
  .side.open { transform: none; }
  .scrim.open { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 11; }
}
@media (prefers-reduced-motion: no-preference) { .side { transition: transform .2s ease; } }

main { padding: 28px; min-width: 0; display: grid; gap: 18px; align-content: start; max-width: 1320px; width: 100%; }
@media (max-width: 600px) { main { padding: 16px; } }
.ph { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; justify-content: space-between; }
.ph h1 { margin: 0; font-family: var(--display); font-size: 26px; font-weight: var(--h1w); letter-spacing: -.02em; line-height: 1.2; }
.ph p { margin: 4px 0 0; color: var(--muted); max-width: 72ch; }

.acts { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }

.modal { position: fixed; inset: 0; background: rgba(10,14,20,.45); z-index: 30; display: grid; place-items: center; padding: 16px; }

.dialog h2 { margin: 0; font-family: var(--display); font-size: 19px; font-weight: 600; padding: 18px 20px 0; }

.x { margin-left: auto; background: none; border: 0; cursor: pointer; font-size: 22px; line-height: 1; padding: 2px 8px; color: var(--muted); border-radius: 6px; }
.ptabs { display: flex; gap: 2px; padding: 0 10px; border-bottom: 1px solid var(--line); overflow-x: auto; }

.ptabs button[aria-selected="true"], .tabs button[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }

.pbody { padding: 16px; display: grid; gap: 12px; align-content: start; overflow-y: auto; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.balrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; }
.bal { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--muted); }

.bal .to { color: var(--err-strong); }
pre.resp { background: var(--chip); border-radius: 8px; padding: 10px; font-size: 12px; white-space: pre-wrap; margin: 0; font-family: Consolas, "Courier New", monospace; }

.hello { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; justify-content: space-between; }
.hello h1 { margin: 0; font-family: var(--display); font-size: 30px; font-weight: var(--h1w); letter-spacing: -.02em; line-height: 1.2; }
.hello p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
.mgrid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr); gap: 20px; align-items: start; }
@media (max-width: 1000px) { .mgrid { grid-template-columns: minmax(0, 1fr); } }
.dcard { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; display: grid; gap: 14px; }
.dcard.leaving { opacity: 0; transform: translateX(16px); transition: opacity 320ms ease, transform 320ms ease; pointer-events: none; }   /* a decided card fades and drifts off (Motion.tsx Leaving, LEAVE_MS) */
.dhead { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.dhead .nm { font-weight: 650; font-size: 15.5px; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); }
.pill.ot { background: #fcefe2; color: #b0570d; } .pill.co { background: #ebebf8; color: #4c4f9e; } .pill.sick { background: #e8ecf0; color: #4b5d6e; } .pill.vac { background: #e2f2f4; color: #1f6c7c; } .pill.half { background: #e6f1ea; color: #3f7558; } .pill.pay { background: #e3f3e8; color: #2e7d4f; }
:root[data-theme="dark"] .pill.ot, :root[data-theme="dark"] .pill.co, :root[data-theme="dark"] .pill.sick, :root[data-theme="dark"] .pill.vac, :root[data-theme="dark"] .pill.half, :root[data-theme="dark"] .pill.pay { filter: invert(.88) hue-rotate(180deg); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill.ot, :root:not([data-theme="light"]) .pill.co, :root:not([data-theme="light"]) .pill.sick, :root:not([data-theme="light"]) .pill.vac, :root:not([data-theme="light"]) .pill.half, :root:not([data-theme="light"]) .pill.pay { filter: invert(.88) hue-rotate(180deg); } }
/* "Taken from" (#296, #307): one soft pill per balance a request's days came from; chips wrap so they never scroll sideways. */
.tf { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: baseline; }
.tf .pill { font-size: 11.5px; padding: 2px 8px; }
.tf .pill b { font-variant-numeric: tabular-nums; font-weight: 700; }
/* Staff profile (#306): one surface, balances and details on the left, the Activity list on the right. Stacks under 860px. */
.pf2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.pf2 > section { padding: 18px 16px; display: grid; gap: 16px; align-content: start; min-width: 0; }
.pf2 > section + section { border-left: 1px solid var(--line); }
@media (max-width: 860px) { .pf2 { grid-template-columns: minmax(0, 1fr); } .pf2 > section + section { border-left: 0; border-top: 1px solid var(--line); } }
.pfh { display: flex; align-items: baseline; gap: 10px; }

.pfh .hint { font-size: 12px; color: var(--muted); }
.actleg { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }

.actlist { list-style: none; margin: 0; padding: 0; }

.when { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }

.datebox b { font-family: var(--display); font-size: 20px; font-weight: 600; line-height: 1.1; }
.arrow { color: var(--muted); }
.quote { color: var(--muted); font-style: italic; }
.impacts { display: grid; gap: 8px; }
.imp { display: grid; grid-template-columns: 90px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
.meter { height: 8px; background: var(--chip); border-radius: 999px; position: relative; overflow: hidden; display: block; }
.meter .keep { position: absolute; top: 0; bottom: 0; left: 0; background: var(--primary); border-radius: 999px; }

.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); min-width: 560px; }

.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #11151c; color: #fff; padding: 11px 16px; border-radius: 10px; box-shadow: var(--shadow-lg); font-size: 13px; z-index: 40; max-width: calc(100vw - 32px); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
.kpi { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); display: grid; gap: 2px; }
.kpi small { color: var(--muted); font-size: 12.5px; font-weight: 500; }
.kpi b { font-family: var(--display); font-size: 30px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .trend { font-size: 12px; color: var(--muted); }
.kpi .trend.up { color: var(--ok); } .kpi .trend.down { color: var(--err); }
.spark { width: 100%; height: 30px; margin-top: 4px; }

/* manager: the animated timeline */
.tl { position: relative; min-width: 760px; }
.tl-head, .tl-row { display: grid; grid-template-columns: 150px minmax(0, 1fr); }
.tl-days { display: grid; grid-template-columns: repeat(var(--n, 28), minmax(0, 1fr)); }
.tl-days span { font-size: 10.5px; text-align: center; color: var(--muted); padding: 8px 0 6px; font-weight: 600; line-height: 1.2; }
.tl-days span.we { opacity: .45; }
.tl-days span.hol { color: var(--accent); }
.tl-days span.now { color: var(--primary); }
.tl-row { border-top: 1px solid var(--line); min-height: 52px; }
.tl-who { display: flex; gap: 8px; align-items: center; padding: 0 12px; font-size: 13px; font-weight: 600; }
.tl-track { position: relative; background-image: repeating-linear-gradient(90deg, transparent 0, transparent calc(100% / var(--n, 28) - 1px), var(--line) calc(100% / var(--n, 28) - 1px), var(--line) calc(100% / var(--n, 28))); }
.tl-shade { position: absolute; top: 0; bottom: 0; background: var(--hover); }
.tl-shade.hol { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.tl-bar { position: absolute; top: 12px; height: 28px; border-radius: 8px; color: #fff; font-size: 11.5px; font-weight: 600; display: flex; align-items: center; padding: 0 8px; white-space: nowrap; overflow: hidden; transform-origin: left center; box-shadow: 0 2px 6px rgba(0,0,0,.12); cursor: default; }
.tl-bar.pending { background: transparent !important; border: 2px dashed currentColor; box-shadow: none; }
.tl-now { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--primary); z-index: 2; }
.tl-now::before { content: "Today"; position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 700; color: var(--primary-ink); background: var(--primary); padding: 1px 6px; border-radius: 999px; }
.tl-gap { padding-top: 18px; }
/* Entrances, charts and bars, named and timed to match the live app. Declared
   unconditionally; the reduce killswitch at the end turns them off unless the
   Animations control is set to On (html[data-anim="on"]). */
#main.enter-on { animation: enter .32s ease-out both; }                                             /* Motion.Enter on each screen/tab change */
.anim .tl-bar { transform-origin: left; animation: tlgrow .5s both cubic-bezier(.2,.8,.2,1); }      /* timeline bars; per-bar delay set inline: .1 + .06*n */
.anim .tl-now { animation: fadein .6s .4s both; }
.anim .vbar { transform-origin: bottom; transform-box: fill-box; animation: barrise .6s both ease-out; }  /* months; per-bar delay inline: k*.05 */
.anim .chart .line { stroke-dasharray: 2000; stroke-dashoffset: 2000; animation: draw 1.4s both ease-out; }  /* line chart draws in */
.anim .spark .line { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1.2s .2s both ease-out; } /* sparkline draws in */
.anim .area { animation: fadein 1s .6s both; }
.anim .ring-fg { animation: ring 1s both ease-out; }                                                /* vacation rings; per-ring delay inline: k*.1 */
.anim .dcard { animation: cardin .45s both ease-out; }                                              /* each decision card rises in */
.anim .meter .keep { transform-origin: left; animation: grow .7s both ease-out; }                   /* balance / by-kind bars grow across */
.anim .meter .use { transform-origin: left; animation: tlgrow .6s .2s both ease-out; }              /* the change part of a balance meter */
@keyframes enter { from { opacity: 0; transform: translateY(6px); } }
@keyframes cardin { from { opacity: 0; transform: translateY(8px); } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@keyframes barrise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes tlgrow { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes ring { from { stroke-dashoffset: var(--c); } }
/* Remote Desktop and some systems force prefers-reduced-motion: reduce, which
   would hide every animation. Turn them off there, UNLESS the person set
   Animations to On in the practice bar, which overrides the system preference. */
@media (prefers-reduced-motion: reduce) {
  html:not([data-anim="on"]) *, html:not([data-anim="on"]) *::before, html:not([data-anim="on"]) *::after { animation: none !important; }
}

/* manager: charts */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart .grid { stroke: var(--line); }
.chart .line { fill: none; stroke: var(--primary); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: color-mix(in srgb, var(--primary) 16%, transparent); }
.chart .min { stroke: var(--accent); stroke-dasharray: 5 4; stroke-width: 1.5; }
.chart .dip { fill: var(--accent); }
.rings { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; padding: 4px 16px 16px; }
.ring { display: grid; justify-items: center; gap: 4px; text-align: center; font-size: 12.5px; }
.ring svg { width: 92px; height: 92px; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--chip); stroke-width: 9; }
.ring-fg { fill: none; stroke-width: 9; stroke-linecap: round; }
.ring .val { margin-top: -66px; margin-bottom: 26px; font-family: var(--display); font-size: 19px; font-weight: 600; line-height: 1; }
.ring .val small { display: block; font-family: var(--font); font-size: 10.5px; color: var(--muted); font-weight: 500; margin-top: 2px; }
.insights { list-style: none; margin: 0; padding: 0; }
.insights li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-top: 1px solid var(--line); font-size: 13px; }
.insights li:first-child { border-top: 0; }
.insights .ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; font-size: 14px; font-weight: 700; }
.ic.warn { background: var(--warn-soft); color: var(--warn); } .ic.info { background: var(--info-soft); color: var(--info); } .ic.ok { background: var(--ok-soft); color: var(--ok); }
.chartbox { padding: 6px 16px 16px; }
.leg { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding: 0 16px 12px; }
.leg i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 5px; vertical-align: -1px; }

/* request page (the public front page) */
.rp { min-height: calc(100vh - 42px); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); }
@media (max-width: 900px) { .rp { grid-template-columns: minmax(0, 1fr); } }
.rp-side { background: var(--primary); color: var(--primary-ink); padding: 48px clamp(20px, 5vw, 64px); display: grid; align-content: space-between; gap: 32px; position: relative; overflow: hidden; }
.rp-side::after { content: ""; position: absolute; width: 420px; height: 420px; border-radius: 50%; right: -160px; bottom: -160px; background: color-mix(in srgb, var(--accent) 55%, transparent); filter: blur(2px); opacity: .5; }
.rp-side h1 { font-family: var(--display); font-size: clamp(30px, 4vw, 44px); line-height: 1.1; margin: 18px 0 10px; font-weight: 600; letter-spacing: -.02em; max-width: 14ch; }
.rp-side p { margin: 0; opacity: .85; max-width: 42ch; font-size: 15px; }
.rp-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; position: relative; z-index: 1; }
.rp-steps li { display: flex; gap: 12px; align-items: center; opacity: .6; font-weight: 500; }
.rp-steps li.on { opacity: 1; font-weight: 700; }
.rp-steps li.done { opacity: .9; }
.rp-steps .dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
.rp-steps li.on .dot, .rp-steps li.done .dot { background: var(--primary-ink); color: var(--primary); border-color: var(--primary-ink); }
.rp-brand { display: flex; gap: 10px; align-items: center; font-weight: 700; position: relative; z-index: 1; }
.rp-brand .mark { background: var(--primary-ink); color: var(--primary); }
.rp-brand .mark i { border-color: var(--primary); }
.rp-main { padding: 48px clamp(16px, 5vw, 64px); display: grid; align-content: center; }
.rp-card { width: min(520px, 100%); display: grid; gap: 18px; }
.rp-card h2 { margin: 0; font-family: var(--display); font-size: 26px; font-weight: 600; letter-spacing: -.01em; }
.rp-card .lead { color: var(--muted); margin: -10px 0 0; }
.big { padding: 12px 14px; font-size: 16px; border-radius: 10px; }
.btn.lg { padding: 12px 20px; font-size: 15px; border-radius: 10px; justify-content: center; }
.digits { display: flex; gap: 8px; }
.digits input { width: 52px; height: 60px; text-align: center; font-size: 24px; font-weight: 600; border: 1.5px solid var(--line2); border-radius: 10px; background: var(--paper); color: var(--ink); font-family: var(--display); }
.digits input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--primary-soft); }
@media (max-width: 420px) { .digits input { width: 42px; height: 52px; } }
.types { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .types { grid-template-columns: minmax(0, 1fr); } }
.type { text-align: left; border: 1.5px solid var(--line2); background: var(--paper); border-radius: 12px; padding: 12px; cursor: pointer; display: grid; gap: 4px; }
.type b { font-size: 14px; } .type span { font-size: 12px; color: var(--muted); }
.type[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 0 0 1px var(--primary) inset; }
.type .ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--chip); font-size: 16px; }
.type[aria-pressed="true"] .ico { background: var(--primary); color: var(--primary-ink); }
.type.off { opacity: .55; cursor: not-allowed; background: var(--hover); }
.type.off .ico { opacity: .7; }
.supresults { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
.supresults button { border: 1.5px solid var(--line2); background: var(--paper); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.supresults button[aria-pressed="true"] { border-color: var(--primary); background: var(--primary); color: var(--primary-ink); }
.deptchips { display: flex; flex-wrap: wrap; gap: 8px; }
.deptchips button { border: 1.5px solid var(--line2); background: var(--paper); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.deptchips button[aria-pressed="true"] { border-color: var(--primary); background: var(--primary); color: var(--primary-ink); }
.lchips { display: flex; flex-wrap: wrap; gap: 8px; }
.lchips button { border: 1.5px solid var(--line2); background: var(--paper); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.lchips button[aria-pressed="true"] { border-color: var(--primary); background: var(--primary); color: var(--primary-ink); }
.preview { border: 1px dashed var(--line2); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; font-size: 13px; }
.preview .row { display: flex; justify-content: space-between; gap: 10px; }
.who-chip { display: flex; gap: 10px; align-items: center; background: var(--hover); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
.next { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.next li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding-bottom: 16px; position: relative; font-size: 13.5px; }
.next li::before { content: ""; position: absolute; left: 13px; top: 28px; bottom: 0; width: 2px; background: var(--line); }
.next li:last-child::before { display: none; }
.next .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--chip); font-size: 12px; font-weight: 700; }
.next li.done .dot { background: var(--ok); color: #fff; }
.success { width: 64px; height: 64px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; font-size: 30px; font-weight: 700; }
/* Each part of a request step rises in, staggered; replays only when the step changes (.rp-anim is added then). Matches RequestPage.tsx. */
.rp-card.rp-anim > * { animation: rise .45s ease-out both; }
.rp-card.rp-anim > *:nth-child(2) { animation-delay: .05s; }
.rp-card.rp-anim > *:nth-child(3) { animation-delay: .1s; }
.rp-card.rp-anim > *:nth-child(n+4) { animation-delay: .15s; }
.rp-card.rp-anim .success { animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }      /* the sent tick pops in */
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
body.rp-mode:not(.rp-signed) .appbar, body.rp-mode .layout { display: none; }
body:not(.rp-mode) #rp { display: none; }
/* request page mood: the colour follows what is being asked for */
.rp-side, .rp .btn.pri, .type, .rp-steps .dot { transition: background-color .5s ease, color .5s ease, border-color .5s ease; }
.lchips button { transition: background-color .4s ease, color .4s ease, border-color .4s ease; }    /* leave-type pills follow the mood a touch quicker (RequestForm.tsx) */
.rp[data-mood="vacation"]    { --primary: #1f7a8c; --primary-soft: #e2f2f4; --primary-ink: #ffffff; --accent: #f4a259; }
.rp[data-mood="partial"]     { --primary: #4f8a6b; --primary-soft: #e6f1ea; --primary-ink: #ffffff; --accent: #e9c46a; }
.rp[data-mood="sick"]        { --primary: #4b5d6e; --primary-soft: #e8ecf0; --primary-ink: #ffffff; --accent: #8fa6ba; }
.rp[data-mood="bereavement"] { --primary: #3a3340; --primary-soft: #ebe8ee; --primary-ink: #f1edf3; --accent: #7d6e86; }
.rp[data-mood="jury"]        { --primary: #2f3b4c; --primary-soft: #e6e9ee; --primary-ink: #eef1f5; --accent: #8a96a8; }
.rp[data-mood="overtime"]    { --primary: #c4610f; --primary-soft: #fcefe2; --primary-ink: #ffffff; --accent: #f6c445; }
.rp[data-mood="carry"]       { --primary: #4c4f9e; --primary-soft: #ebebf8; --primary-ink: #ffffff; --accent: #e07a5f; }
.rp[data-mood="payout"]      { --primary: #2e7d4f; --primary-soft: #e3f3e8; --primary-ink: #ffffff; --accent: #d9a826; }
.rp[data-mood="bereavement"] .rp-side::after, .rp[data-mood="jury"] .rp-side::after, .rp[data-mood="sick"] .rp-side::after { opacity: .22; }
.rp[data-mood="overtime"] .rp-side::after, .rp[data-mood="payout"] .rp-side::after { opacity: .7; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .rp[data-mood="vacation"]    { --primary: #62b7c6; --primary-soft: #12313a; --primary-ink: #06191d; }
  :root:not([data-theme="light"]) .rp[data-mood="partial"]     { --primary: #86c09f; --primary-soft: #16301f; --primary-ink: #08180e; }
  :root:not([data-theme="light"]) .rp[data-mood="sick"]        { --primary: #8ea2b6; --primary-soft: #1d252e; --primary-ink: #0d1218; }
  :root:not([data-theme="light"]) .rp[data-mood="bereavement"] { --primary: #a596ae; --primary-soft: #241f28; --primary-ink: #141016; }
  :root:not([data-theme="light"]) .rp[data-mood="jury"]        { --primary: #95a3b8; --primary-soft: #1c222c; --primary-ink: #0d1117; }
  :root:not([data-theme="light"]) .rp[data-mood="overtime"]    { --primary: #f29a4a; --primary-soft: #3a220d; --primary-ink: #1e0f02; }
  :root:not([data-theme="light"]) .rp[data-mood="carry"]       { --primary: #9a9cf0; --primary-soft: #23244a; --primary-ink: #0f1030; }
  :root:not([data-theme="light"]) .rp[data-mood="payout"]      { --primary: #6cc792; --primary-soft: #133222; --primary-ink: #06180d; }
}
:root[data-theme="dark"] .rp[data-mood="vacation"]    { --primary: #62b7c6; --primary-soft: #12313a; --primary-ink: #06191d; }
:root[data-theme="dark"] .rp[data-mood="partial"]     { --primary: #86c09f; --primary-soft: #16301f; --primary-ink: #08180e; }
:root[data-theme="dark"] .rp[data-mood="sick"]        { --primary: #8ea2b6; --primary-soft: #1d252e; --primary-ink: #0d1218; }
:root[data-theme="dark"] .rp[data-mood="bereavement"] { --primary: #a596ae; --primary-soft: #241f28; --primary-ink: #141016; }
:root[data-theme="dark"] .rp[data-mood="jury"]        { --primary: #95a3b8; --primary-soft: #1c222c; --primary-ink: #0d1117; }
:root[data-theme="dark"] .rp[data-mood="overtime"]    { --primary: #f29a4a; --primary-soft: #3a220d; --primary-ink: #1e0f02; }
:root[data-theme="dark"] .rp[data-mood="carry"]       { --primary: #9a9cf0; --primary-soft: #23244a; --primary-ink: #0f1030; }
:root[data-theme="dark"] .rp[data-mood="payout"]      { --primary: #6cc792; --primary-soft: #133222; --primary-ink: #06180d; }

/* every request case on one page */
.cases { max-width: 1180px; margin: 0 auto; padding: 28px 16px 64px; display: grid; gap: 34px; }
.cases header h1 { font-family: var(--display); font-weight: 600; font-size: 30px; margin: 0 0 4px; }
.cases header p { margin: 0 0 14px; }
.ctoc { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.ctoc .small { margin: 0 2px 0 10px; } .ctoc .small:first-child { margin-left: 0; }
.cgroup { display: grid; gap: 18px; }
.cgroup h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 21px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.case { display: grid; gap: 10px; scroll-margin-top: 12px; }
.chead { display: flex; gap: 12px; align-items: center; }
.chead .btn { margin-left: auto; flex: none; }
.cnum { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: var(--primary-ink); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
.frame { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); background: var(--bg); pointer-events: none; }
.frame .rp { min-height: 0; }
.frame .rp-side { padding: 28px; gap: 22px; }
.frame .rp-side h1 { font-size: 26px; margin-top: 12px; }
.frame .rp-main { padding: 28px clamp(16px, 4vw, 40px); }
.frame .rp-card > *, .frame .success { animation: none !important; }

/* Employee header: the Staff Directory record, one labelled value each. */
.rec { display: flex; flex-wrap: wrap; gap: 10px 28px; margin: 12px 0 0; }
.rec dt { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.rec dd { margin: 3px 0 0; font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.rec .mgrs { display: flex; flex-wrap: wrap; gap: 6px; }
.mgrchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line2); border-radius: 999px; padding: 2px 10px 2px 2px; font-size: 13px; background: var(--paper); }
.mgrchip .av { width: 22px; height: 22px; font-size: 10px; }
.pots5 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(160px, 100%), 1fr)); gap: 14px; }
.kbar { display: grid; grid-template-columns: minmax(110px, 180px) minmax(0, 1fr) 48px; gap: 10px; align-items: center; font-size: 13px; }
.kbar b { text-align: right; font-variant-numeric: tabular-nums; }
/* Emails view. */
.mails { max-width: 1240px; margin: 0 auto; padding: 28px 16px 64px; display: grid; gap: 22px; }
.mails header h1 { font-family: var(--display); font-weight: 600; font-size: 30px; margin: 0 0 4px; }
.mails header p { margin: 0; max-width: 80ch; }
.mchg { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 12px; }
.mchg .paper { padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.mgrid2 { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 880px) { .mgrid2 { grid-template-columns: minmax(0, 1fr); } .elist { max-height: 300px; } }
.elist { max-height: 80vh; overflow: auto; padding-bottom: 6px; }
.eitem { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 9px 16px; cursor: pointer; font: inherit; font-size: 13px; color: var(--ink); }
.eitem:hover { background: var(--hover); }
.eitem[aria-current="true"] { background: var(--hover); box-shadow: inset 3px 0 var(--primary); font-weight: 600; }
.ehead { padding: 14px 16px; border-bottom: 1px solid var(--line); }
.ehead dd { overflow-wrap: anywhere; }
.etools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; }
.einbox { background: #eef1f4; border-top: 1px solid var(--line); padding: 16px; display: flex; justify-content: center; border-radius: 0 0 var(--radius) var(--radius); }
.emailf { width: 100%; max-width: 760px; height: 300px; border: 0; background: #fff; display: block; }
.emailf.phone { max-width: 390px; }

/* Signed-in account bar on the request page, and the signed-out landing tiles. */
.acct { display: grid; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
.acct-who { display: flex; gap: 10px; align-items: center; font-size: 14px; }

      case 'docancelheld': m.req.status = 'Rejected'; m.req.why = 'Cancelled'; m.req.age = 0; state.modal = null; state.reqSel = null; toast('Held request cancelled (example).'); render(); return;
      case 'mgrs': var p = person(t.getAttribute('data-who')); state.modal = { kind: 'mgrs', who: p.name, sel: p.mgrs.slice() }; render(); return;
      case 'savemgrs':
        var pp = person(m.who); pp.mgrs = m.sel.slice();
        if (pp.mgrs.length) SETUP = SETUP.filter(function (s) { return !(s.who === pp.name && s.problems[0] === 'No supervisor assigned'); });
        state.modal = null; toast('Managers saved for ' + pp.name + ' (example).'); render(); return;
      case 'wizard': state.modal = { kind: 'wizard', step: 1, op: 'replace' }; render(); return;
      case 'wzpreview': m.from = $('wzFrom').value; m.to = $('wzTo') ? $('wzTo').value : null; m.step = 2; render(); return;
      case 'wzback': m.step = 1; render(); return;
      case 'wzdone': state.modal = null; toast('Assignments updated (example, nothing saved).'); render(); return;
      case 'addheld': state.prefill = { name: r.who, email: r.email, dept: r.dept, mgrs: [r.mgr], held: r }; state.created = null; state.reqSel = null; state.screen = 'add'; render(); window.scrollTo(0, 0); return;
      case 'create':
        var pf = state.prefill || {}, scope = t.closest('.form');
        var name = (scope.querySelector('input') || {}).value || 'New employee', released = 0, mgr = (pf.mgrs || [])[0];
        if (pf.held) { pf.held.status = 'Pending'; pf.held.id = 1450; pf.held.age = 0; pf.held.why = ''; pf.held.cur = { Vacation: 0 }; pf.held.next = { Vacation: -3 }; released = 1; STAFF.push({ id: 8, name: pf.name, email: pf.email, dept: pf.dept || 'Warehouse', loc: pf.loc || 'British Columbia', mgrs: pf.mgrs, vac: 0, sick: 0, mu: 0, co: 0, vacY: 10, sickY: 5 }); }
        if (state.modal) { state.modal = null; toast(name + ' was added to your team (example).'); render(); return; }
        state.created = { name: name, released: released, mgr: mgr }; state.prefill = null; render(); window.scrollTo(0, 0); return;
      case 'another': state.created = null; state.prefill = null; render(); return;
      case 'openperson': var w = person(t.getAttribute('data-who')); state.screen = 'staff'; state.created = null; state.sel = w ? w.id : null; state.ptab = 'Balances'; render(); return;
      case 'closepanel': state.sel = null; state.reqSel = null; render(); return;
      case 'endflow': state.flow = null; render(); return;
      case 'cmdclear': state.reqChecked = []; render(); return;                    // drop the selection
      case 'cmdapprove': { var ca = checkedReqs(), na = 0; ca.forEach(function (x) { if (x.status === 'Pending') { x.status = 'Approved'; x.age = 0; na++; } }); state.reqChecked = []; state.reqSel = null; toast('Approved ' + na + ' request' + (na === 1 ? '' : 's') + '. Each person is emailed (example).'); render(); return; }
      case 'cmdreject': { var cr2 = checkedReqs(), nr = 0; cr2.forEach(function (x) { if (x.status === 'Pending') { x.status = 'Rejected'; x.age = 0; nr++; } }); state.reqChecked = []; state.reqSel = null; toast('Rejected ' + nr + ' request' + (nr === 1 ? '' : 's') + ' (example).'); render(); return; }
      case 'cmdremind': { var nrem = checkedReqs().filter(function (x) { return x.status === 'Pending'; }).length; state.reqChecked = []; toast('Reminder sent for ' + nrem + ' request' + (nrem === 1 ? '' : 's') + ' (example).'); render(); return; }
      case 'cmdexport': toast('Downloaded requests.xlsx (example).'); return;
      case 'cmddelete': { var keys = state.reqChecked.slice(), nd = keys.length; REQS = REQS.filter(function (x) { return keys.indexOf(x.id + '|' + x.who + '|' + x.status) < 0; }); state.reqChecked = []; state.reqSel = null; toast('Deleted ' + nd + ' request' + (nd === 1 ? '' : 's') + ', with a few seconds to undo (example).'); render(); return; }
      case 'newreq': state.modal = { kind: 'newreq' }; render(); return;           // open the add-a-request form
      case 'donewreq': state.modal = null; toast('Request created (example). It shows in the list, pending its manager.'); render(); return;
      case 'checkone': case 'checkpicked':
        var nm = act === 'checkone' ? t.getAttribute('data-who') : $('checkPick').value;
        var s2 = SETUP.filter(function (s) { return s.who === nm; })[0];
        state.setupChecked = { who: nm, problems: s2 ? s2.problems : [], fix: s2 ? s2.fix : '' }; render(); return;
      case 'refreshsetup': toast('Employee setup refreshed: ' + SETUP.length + ' with problems (example).'); return;
      case 'maildetail': state.modal = { kind: 'mail', i: +t.getAttribute('data-i') }; render(); return;
      case 'checklist': state.modal = { kind: 'checklist' }; render(); return;
      case 'mgradd': state.modal = { kind: 'mgradd' }; render(); return;
      case 'rpsend':
        var em2 = ($('rpEmail').value || '').trim();
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em2)) { state.rp.email = em2; state.rp.err = 'Enter a full email address.'; render(); return; }
        state.rp.email = em2; state.rp.err = ''; state.rp.tries = 5; state.rp.step = 'code'; render(); return;
      case 'rpresend': state.rp.err = ''; toast('A new code is on its way to ' + state.rp.email + ' (example).'); render(); return;
      case 'rpback': state.rp.step = 'email'; state.rp.err = ''; render(); return;
      case 'rpverify':
        var code = Array.prototype.map.call(document.querySelectorAll('[data-dig]'), function (i) { return i.value; }).join('');
        if (code.length < 6) { state.rp.err = 'Enter all 6 digits.'; render(); return; }
        if (code === '000000') { state.rp.tries--; state.rp.err = 'That code is not right. ' + state.rp.tries + ' tries left.'; render(); return; }
        var st = STAFF.filter(function (p) { return p.email && p.email.toLowerCase() === state.rp.email.toLowerCase(); })[0];
        state.rp.err = ''; state.rp.notice = ''; state.rp.session = st ? st.name : null; state.rp.step = st ? 'form' : 'about'; if (st) { state.role = state.after || 'employee'; state.after = null; } render(); window.scrollTo(0, 0); return;
      case 'rpremember': state.rp.email = 'avery.example@ucsh.com'; state.rp.session = 'Avery Example'; state.rp.step = 'form'; state.rp.err = ''; render(); return;
      case 'rpsignout': state.rp = mix(JSON.parse(RP_BASE), { notice: 'Signed out. This browser no longer remembers you.' }); state.role = 'request'; state.after = null; state.flow = null; render(); window.scrollTo(0, 0); return;
      case 'rpas': var who2 = t.getAttribute('data-who'); state.rp.email = person(who2).email; state.rp.session = who2; state.rp.step = 'form'; state.rp.err = ''; state.rp.notice = ''; state.role = state.after || 'employee'; state.after = null; render(); window.scrollTo(0, 0); return;
      case 'godash': state.role = t.getAttribute('data-r'); if (state.role === 'admin') state.screen = 'home'; render(); window.scrollTo(0, 0); return;
      case 'rpcontinue':
        // Combine the two name fields and move from "About you" to the request itself.
        state.rp.name = ((state.rp.first || '') + ' ' + (state.rp.last || '')).trim();
        state.rp.step = 'newhire'; state.rp.err = ''; render(); window.scrollTo(0, 0); return;
      case 'rpchange': state.rp.step = 'about'; state.rp.err = ''; render(); window.scrollTo(0, 0); return;   // the "Change" link back to About you
      case 'rpsubmit':
        if (state.rp.step === 'newhire' && !state.rp.name.trim()) { state.rp.err = 'Enter your first and last name.'; render(); return; }
        if (state.rp.type === 'leave' && state.rp.leave !== 'Half Day or Partial Day Off' && state.rp.end < state.rp.start) { state.rp.err = 'The last day away is before the first.'; render(); return; }
        state.rp.err = ''; if (state.rp.session) submitRequest(state.rp); state.rp.step = 'done'; render(); window.scrollTo(0, 0); return;
      case 'rpanother': state.rp.step = state.rp.session ? 'form' : 'email'; state.rp.notes = ''; render(); return;
      case 'rpdash': state.role = 'employee'; render(); window.scrollTo(0, 0); return;
      case 'request': state.rp = mix(JSON.parse(RP_BASE), state.rp.session ? { step: 'form', session: state.rp.session, email: state.rp.email } : SIGNED, { via: 'dash' }); state.role = 'request'; render(); window.scrollTo(0, 0); return;
    }
    var msgs = { remind: 'Reminder sent to the manager (example)', link: 'Link action (example)', editholiday: 'Edit holiday (example)', addholiday: 'Add holiday (example)', delholiday: 'Delete asks first (example)', request: 'Opens the request page (example)', parity: 'Compared: in step (example)', copyhol: 'Copied 12 holidays (example)', retryheld: 'Sent on. The held request was submitted to the manager (example)', copyreq: 'Copied 91 requests from SharePoint into Postgres (example)', addcols: 'Added SubmitterEmail and RequestSource to the request lists (example)' };
    if (msgs[act]) toast(msgs[act]);
  });
  document.addEventListener('change', function (e) {
    // A row checkbox toggled: add or drop its key from the selection.
    var rc = e.target.getAttribute && e.target.getAttribute('data-rcheck');
    if (rc != null) { var i = state.reqChecked.indexOf(rc); if (e.target.checked && i < 0) state.reqChecked.push(rc); else if (!e.target.checked && i >= 0) state.reqChecked.splice(i, 1); render(); return; }
    // The header checkbox: tick or clear every row currently shown.
    if (e.target.hasAttribute && e.target.hasAttribute('data-rcheckall')) { var keys = Array.prototype.map.call(document.querySelectorAll('input[data-rcheck]'), function (b) { return b.getAttribute('data-rcheck'); }); state.reqChecked = e.target.checked ? keys : []; render(); return; }
    var k = e.target.getAttribute && e.target.getAttribute('data-fsel');
    if (k) { state.filter[k] = e.target.value; render(); }
    var rs = e.target.getAttribute && e.target.getAttribute('data-rpsel');
    if (rs) { state.rp[rs] = e.target.value; if (rs === 'co') render(); }
    if (e.target.getAttribute && e.target.getAttribute('data-live')) { state.rp[e.target.getAttribute('data-rp')] = e.target.value; render(); }
  });
  document.addEventListener('keydown', function (e) {
    var tr = e.target.closest && e.target.closest('tr[data-sel], tr[data-rsel]');
    if (tr && e.target === tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); if (tr.hasAttribute('data-sel')) state.sel = +tr.getAttribute('data-sel'); else state.reqSel = tr.getAttribute('data-rsel'); render(); }
    if (e.key === 'Escape') { closeMenu(); if (state.modal) state.modal = null; else { state.sel = null; state.reqSel = null; } render(); }
    if (e.key === 'Backspace' && e.target.hasAttribute && e.target.hasAttribute('data-dig') && !e.target.value) { var pv = document.querySelector('[data-dig="' + (+e.target.getAttribute('data-dig') - 1) + '"]'); if (pv) pv.focus(); }
    if (e.key === 'Enter' && e.target.id === 'rpEmail') { var sb = document.querySelector('[data-act="rpsend"]'); if (sb) sb.click(); }
    if (e.key === 'Enter' && e.target.id === 'reasonIn') { var b = document.querySelector('[data-act="doreprocess"]'); if (b) b.click(); }
  });
  document.addEventListener('input', function (e) {
    var rk = e.target.getAttribute && e.target.getAttribute('data-rp');
    if (rk) {
      state.rp[rk] = e.target.value;
      // Dates change the preview; re-render only then so typing in text boxes keeps focus.
      if (e.target.type === 'date') render();
      return;
    }
    // "About you" fields re-render live (name enables Continue, search filters the list), then focus is restored.
    var ab = e.target.getAttribute && e.target.getAttribute('data-about');
    if (ab) {
      state.rp[ab] = e.target.value;
      if (ab === 'first' || ab === 'last') state.rp.name = ((state.rp.first || '') + ' ' + (state.rp.last || '')).trim();
      var apos = e.target.selectionStart;
      render();
      var ag = document.querySelector('[data-about="' + ab + '"]');
      if (ag) { ag.focus(); try { ag.setSelectionRange(apos, apos); } catch (er) {} }
      return;
    }
    var dg = e.target.getAttribute && e.target.getAttribute('data-dig');
    if (dg !== null && dg !== undefined) {
      var v = e.target.value.replace(/\D/g, '');
      var boxes = document.querySelectorAll('[data-dig]');
      if (v.length > 1) { v.split('').slice(0, 6).forEach(function (c, i) { if (boxes[i]) boxes[i].value = c; }); (boxes[Math.min(v.length, 6) - 1] || e.target).focus(); }
      else { e.target.value = v; if (v && boxes[+dg + 1]) boxes[+dg + 1].focus(); }
      if (Array.prototype.every.call(boxes, function (b) { return b.value; })) { var go2 = document.querySelector('[data-act="rpverify"]'); if (go2) go2.click(); }
      return;
    }
    var k = e.target.getAttribute && e.target.getAttribute('data-search');
    if (!k) return;
    state.filter[k] = e.target.value;
    var pos = e.target.selectionStart;
    render();
    var again = document.querySelector('[data-search="' + k + '"]');
    if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (er) {} }
  });
  $('scrim').addEventListener('click', closeMenu);
  window.addEventListener('hashchange', function () { fromHash(); render(); });
  fromHash();
  applyAnim();                                                // reflect the remembered Animations choice on <html> and the buttons
  try { if (!localStorage.getItem('ucshooadmin-welcomed') && !location.hash) { localStorage.setItem('ucshooadmin-welcomed', '1'); openWelcome(); } } catch (e) { if (!location.hash) openWelcome(); }
  render();
})();
